services:
  - type: web
    name: python-model-runner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_ID
        value: distilgpt2
      - key: MODEL_LIST
        value: distilgpt2
